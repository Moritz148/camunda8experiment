name: camunda8experiment
author: Moritz Schwarz <moritz.schwarz@envite.de>
description: usage_scenario for camunda8experiment

compose-file: !include docker-compose.yaml

services:
  experiment:
    command: /bin/sh

flow:
  - name: experiment-c8
    container: experiment
    commands:
      - type: console
        command: > 
          java -cp /app/resources:/app/classes:/app/libs/* org.springframework.boot.loader.launch.JarLauncher
        log-stdout: true
        log-stderr: true
