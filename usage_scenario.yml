name: camunda8experiment
author: Moritz Schwarz <moritz.schwarz@envite.de>
description: usage_scenario for camunda8experiment

compose-file: !include docker-compose-new.yaml

services:
  c8-experiment_new:
    command: /bin/sh

flow:
    - name: c8-experiment_new
      container: c8-experiment_new
      commands:
      - type: console
        command: java -jar demo.jar
        log-stdout: true
#        log-stderr: true
